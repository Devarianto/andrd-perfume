<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Parfum — ANDRD</title>
  <meta name="description" content="Jelajahi koleksi parfum ANDRD. Filter berdasarkan aroma, gender, ukuran, dan harga.">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Koleksi Parfum — ANDRD">
  <meta property="og:description" content="Extrait de Parfum lokal dalam batch terbatas.">
  <meta property="og:image" content="assets/img/products/perfume-1-a.svg">

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="announcement-bar" id="announcementBar"></div>
  <header class="site-header" id="siteHeader"></header>

  <main>
    <section class="section" style="padding-top:28px;">
      <div class="container">
        <!-- Judul Singkat -->
        <div style="margin-bottom:20px;">
          <h1 class="section-title" id="catalogPageTitle">Semua Parfum</h1>
          <span id="catalogCountLabel" style="font-size:12.5px;color:var(--color-text-muted);">Menampilkan 10 produk</span>
        </div>

        <!-- Toolbar Mobile & Desktop: Tombol Filter (Mobile) + Urutkan -->
        <div class="catalog-toolbar">
          <button type="button" class="mobile-filter-btn" id="mobileFilterToggleBtn" aria-expanded="false" aria-controls="catalogFilterPanel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
              <line x1="11" y1="18" x2="13" y2="18"></line>
            </svg>
            <span id="mobileFilterBtnText">Filter</span>
          </button>

          <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
            <label for="catalogSortSelect" style="font-size:12.5px;color:var(--color-text-muted);white-space:nowrap;">Urutkan:</label>
            <select id="catalogSortSelect" class="select-control" style="width:auto;padding:7px 12px;font-size:12.5px;">
              <option value="featured">Unggulan</option>
              <option value="price-asc">Harga Terendah</option>
              <option value="price-desc">Harga Tertinggi</option>
              <option value="name-asc">Nama A – Z</option>
            </select>
          </div>
        </div>

        <div class="catalog-layout">
          <!-- Panel Filter (Di Mobile tersembunyi default, buka lewat tombol Filter) -->
          <aside class="filter-panel" id="catalogFilterPanel" aria-label="Filter Produk">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <strong style="font-size:13.5px;">Filter Produk</strong>
              <button type="button" id="resetFiltersBtn" style="font-size:12px;color:var(--color-text-muted);text-decoration:underline;">Reset</button>
            </div>

            <!-- Cari Kata Kunci -->
            <div class="filter-group">
              <input type="search" id="catalogSearchInput" class="form-control" placeholder="Cari parfum / notes...">
            </div>

            <!-- Filter Kategori Aroma -->
            <div class="filter-group">
              <h3 class="filter-title">Aroma</h3>
              <div class="filter-options">
                <label class="filter-checkbox"><input type="checkbox" name="filterScent" value="Citrus"> Citrus</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterScent" value="Floral"> Floral</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterScent" value="Fruity"> Fruity</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterScent" value="Woody & Vanilla"> Woody &amp; Vanilla</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterScent" value="Gourmand"> Gourmand</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterScent" value="Musky"> Musky</label>
              </div>
            </div>

            <!-- Filter Gender -->
            <div class="filter-group">
              <h3 class="filter-title">Karakter</h3>
              <div class="filter-options">
                <label class="filter-checkbox"><input type="checkbox" name="filterGender" value="For Her"> For Her</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterGender" value="For Him"> For Him</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterGender" value="Unisex"> Unisex</label>
              </div>
            </div>

            <!-- Filter Ukuran -->
            <div class="filter-group">
              <h3 class="filter-title">Ukuran</h3>
              <div class="filter-options">
                <label class="filter-checkbox"><input type="checkbox" name="filterSize" value="15ml"> 15ml</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterSize" value="50ml"> 50ml</label>
                <label class="filter-checkbox"><input type="checkbox" name="filterSize" value="100ml"> 100ml</label>
              </div>
            </div>

            <!-- Filter Rentang Harga -->
            <div class="filter-group">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <label for="catalogPriceRange" class="filter-title" style="margin-bottom:0;">Maks. Harga</label>
                <strong id="catalogPriceLabel" style="font-size:12px;">Rp 700.000</strong>
              </div>
              <input type="range" id="catalogPriceRange" min="135000" max="700000" step="10000" value="700000" style="width:100%;accent-color:var(--color-primary);">
            </div>
          </aside>

          <!-- Daftar Produk -->
          <div>
            <div class="product-grid" id="catalogProductsGrid"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="config.js"></script>
  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
